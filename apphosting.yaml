# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SLEEPER_LEAGUE_ID
    value: 1389239115878244352
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    value: boom-tho-league-manager
    availability:
      - RUNTIME

  # FIREBASE_CLIENT_EMAIL and FIREBASE_PRIVATE_KEY are set via the
  # Firebase Console > App Hosting > Environment variables (stored as secrets)
